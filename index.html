<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar Saleta | Projects</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Use Inter as the default font */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 antialiased">

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 md:py-16 lg:py-24">

        <!-- Header -->
        <header class="text-center mb-12 md:mb-16">
            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">
                My Projects
            </h1>
            <p class="mt-3 text-lg md:text-xl text-gray-400 max-w-2xl mx-auto">
                A collection of tools and calculators I've built.
            </p>
        </header>

        <!-- Grid for Project Cards -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">

            <!-- Card 1: Pourover Coffee Calculator -->
            <a href="/pourover/" class="group block bg-gray-800/50 hover:bg-gray-800/80 p-6 rounded-xl shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1">
                <div class="flex items-start">
                    <!-- Icon -->
                    <div class="flex-shrink-0">
                        <div class="h-12 w-12 rounded-lg bg-indigo-500 flex items-center justify-center">
                            <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7.014A8.003 8.003 0 0112 3c2.39 0 4.56.946 6.14 2.486A8.003 8.003 0 0118 10c-2 0-2-2-2-2s.657 1.343 1.657 2.657z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.001 12h-1.122M15 19.5a3 3 0 01-6 0" />
                            </svg>
                        </div>
                    </div>
                    <div class="ml-4">
                        <h2 class="text-xl font-semibold text-white">
                            Pourover Calculator
                        </h2>
                        <p class="mt-2 text-gray-400">
                            A simple tool to help you brew the perfect cup of pourover coffee.
                        </p>
                    </div>
                </div>
            </a>

            <!-- Card 2: Running Nutrition Calculator -->
            <a href="/running-nutrition/" class="group block bg-gray-800/50 hover:bg-gray-800/80 p-6 rounded-xl shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1">
                <div class="flex items-start">
                    <!-- Icon -->
                    <div class="flex-shrink-0">
                        <div class="h-12 w-12 rounded-lg bg-green-500 flex items-center justify-center">
                            <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                               <path stroke-linecap="round" stroke-linejoin="round" d="M5.625 15.75a3.75 3.75 0 1 0-5.25 0L3 21l2.625-5.25ZM15.75 3.75a3.75 3.75 0 1 0-5.25 0L12 9l2.625-5.25Z" />
                            </svg>
                        </div>
                    </div>
                    <div class="ml-4">
                        <h2 class="text-xl font-semibold text-white">
                            Running Nutrition
                        </h2>
                        <p class="mt-2 text-gray-400">
                            Calculate your caloric and hydration needs for training and races.
                        </p>
                    </div>
                </div>
            </a>

        </main>

        <!-- Footer -->
        <footer class="text-center mt-16 text-gray-500">
            <p>&copy; <span id="year"></span> Oscar Saleta. All rights reserved.</p>
        </footer>

    </div>

    <script>
        // Set current year in the footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
